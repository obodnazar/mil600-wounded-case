<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="860" viewBox="0 0 1640 860" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/></marker></defs><rect width="1640" height="860" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="bold" fill="#1b1f24" text-anchor="start">«Кейс поранення»: верхньорівнева ентерпрайз-архітектура</text><text x="1616" y="34" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="end">Навчальний проєкт KSE MIL600 · дані в прототипі вигадані</text><text x="139.0" y="70" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Користувачі</text><text x="139.0" y="88" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="middle">хто працює з кейсом</text><text x="405.0" y="70" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Канали</text><text x="405.0" y="88" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="middle">де вони це бачать</text><text x="835.0" y="70" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Сервіс «Кейс поранення»</text><text x="835.0" y="88" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="middle">новий модуль екосистеми МОУ</text><text x="1383.0" y="70" font-size="15" font-weight="bold" fill="#1b1f24" text-anchor="middle">Наявні системи</text><text x="1383.0" y="88" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="middle">де живуть документи й рішення</text><rect x="24" y="110" width="230" height="84" rx="8" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="132" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Військовослужбовець</text><text x="36" y="151" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">бачить свій кейс, документи,</text><text x="36" y="167" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">строки й виплати</text><rect x="24" y="222" width="230" height="84" rx="8" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="244" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Родина / довірена особа</text><text x="36" y="263" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">звертається через супровід;</text><text x="36" y="279" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">власного доступу немає</text><rect x="24" y="334" width="230" height="84" rx="8" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="356" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Командир частини</text><text x="36" y="375" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">запит довідки, направлення</text><text x="36" y="391" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">на ВЛК; без діагнозів</text><rect x="24" y="446" width="230" height="84" rx="8" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="468" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Служба супроводу</text><text x="36" y="487" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">усі призначені кейси,</text><text x="36" y="503" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">уточнення, звернення</text><rect x="24" y="558" width="230" height="84" rx="8" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="580" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Аналітик / керівництво</text><text x="36" y="599" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">лише агрегати BO,</text><text x="36" y="615" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">без даних людей</text><rect x="290" y="110" width="230" height="84" rx="8" fill="#fdf3e6" stroke="#e0b98a" stroke-width="1.4"/><text x="302" y="132" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Армія+: «Мій кейс»</text><text x="302" y="151" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">мобільний кабінет бійця; простий,</text><text x="302" y="167" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">працює при поганому зв’язку</text><rect x="290" y="334" width="230" height="84" rx="8" fill="#fdf3e6" stroke="#e0b98a" stroke-width="1.4"/><text x="302" y="356" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Армія+: режим командира</text><text x="302" y="375" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">задачі частини:</text><text x="302" y="391" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">довідка, направлення</text><rect x="290" y="446" width="230" height="84" rx="8" fill="#fdf3e6" stroke="#e0b98a" stroke-width="1.4"/><text x="302" y="468" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Робоче місце супроводу</text><text x="302" y="487" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">черга кейсів, задачі,</text><text x="302" y="503" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">журнал звернень</text><rect x="290" y="558" width="230" height="84" rx="8" fill="#fdf3e6" stroke="#e0b98a" stroke-width="1.4"/><text x="302" y="580" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Аналітична панель</text><text x="302" y="599" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">показники BO-1…BO-7,</text><text x="302" y="615" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">пригнічення малих груп</text><line x1="254" y1="152" x2="286" y2="152" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="254" y1="376" x2="286" y2="376" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="254" y1="488" x2="286" y2="488" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="254" y1="600" x2="286" y2="600" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><polyline points="254,284 272,284 272,508 286,508" fill="none" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><text x="278" y="278" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">звернення</text><rect x="560" y="104" width="550" height="560" rx="12" fill="#f5f9fd" stroke="#1f4e79" stroke-width="1.8"/><rect x="576" y="124" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="588" y="146" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Шлюз подій</text><text x="588" y="165" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">перевіряє джерело, підпис,</text><text x="588" y="181" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">повтор; бере лише мінімум полів</text><rect x="839" y="124" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="851" y="146" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Кейс і таймлайн</text><text x="851" y="165" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">один кейс на поранення;</text><text x="851" y="181" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">етап, наступний крок, хто діє</text><rect x="576" y="226" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="588" y="248" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Документи й чеклісти</text><text x="588" y="267" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">окремо ВЛК / винагорода / ОГД;</text><text x="588" y="283" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">версія, автор, отримання</text><rect x="839" y="226" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="851" y="248" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Строки й задачі</text><text x="851" y="267" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">довідка 5 днів; ВЛК до 12 міс.;</text><text x="851" y="283" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">нагадування людині, без санкцій</text><rect x="576" y="328" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="588" y="350" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Доступ і ролі</text><text x="588" y="369" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">перевірка на сервері; командиру</text><text x="588" y="385" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">без діагнозів, аналітику без людей</text><rect x="839" y="328" width="255" height="88" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="851" y="350" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Аналітика</text><text x="851" y="369" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">агрегати BO; невідоме ≠ 0;</text><text x="851" y="385" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">малі групи приховано</text><rect x="576" y="430" width="518" height="70" rx="8" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.4"/><text x="588" y="452" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Журнал і аудит</text><text x="588" y="471" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">хто що побачив і зробив, без медичного змісту; повтор події не дублює дію</text><rect x="576" y="514" width="518" height="86" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/><text x="588" y="536" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">Сховище кейсу</text><text x="588" y="555" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">метадані, стани, задачі, журнал подій, посилання на документи;</text><text x="588" y="571" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">клінічні документи лишаються в МІС, копій медзаписів сервіс не тримає</text><text x="576" y="626" font-size="11.5" font-weight="normal" fill="#1f4e79" text-anchor="start">Сервіс не ставить діагнозів, не підписує документів і не ухвалює рішень:</text><text x="576" y="643" font-size="11.5" font-weight="normal" fill="#1f4e79" text-anchor="start">перевіряє, рахує, нагадує й показує. Вирішують командир, ВЛК, розпорядник коштів.</text><line x1="520" y1="152" x2="556" y2="152" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520" y1="376" x2="556" y2="376" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520" y1="488" x2="556" y2="488" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="520" y1="600" x2="556" y2="600" stroke="#4a5563" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="1220" y="110" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="132" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">МІС ЗСУ</text><text x="1232" y="151" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">еПМК від медика; постанови ВЛК</text><line x1="1216" y1="148" x2="1114" y2="148" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="141" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">еПМК, постанова</text><rect x="1220" y="202" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="224" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Системи закладів / ЕСОЗ</text><text x="1232" y="243" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">надходження, переведення, виписки</text><line x1="1216" y1="240" x2="1114" y2="240" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="233" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">надходження</text><rect x="1220" y="294" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="316" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">СЕДО</text><text x="1232" y="335" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">довідка про обставини травми, накази,</text><text x="1232" y="351" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">квитанції про отримання</text><line x1="1216" y1="332" x2="1114" y2="332" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="325" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">довідка, квитанція</text><rect x="1220" y="386" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="408" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Облік особового складу</text><text x="1232" y="427" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">призначення бійця до частини</text><line x1="1216" y1="424" x2="1114" y2="424" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="417" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">частина бійця</text><rect x="1220" y="478" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="500" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Фінансові джерела / орган ОГД</text><text x="1232" y="519" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">накази, рішення, підтвердження виплат</text><line x1="1216" y1="516" x2="1114" y2="516" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="509" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">стан виплати</text><rect x="1220" y="570" width="396" height="76" rx="8" fill="#f1f3f5" stroke="#c7cdd6" stroke-width="1.4"/><text x="1232" y="592" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">ІКС «Супровід»</text><text x="1232" y="611" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">можливе розміщення модуля; межі</text><text x="1232" y="627" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">й готовність уточнює власник</text><line x1="1114" y1="608" x2="1216" y2="608" stroke="#4a5563" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1118" y="601" font-size="10.5" font-weight="normal" fill="#5a6370" text-anchor="start">розміщення</text><rect x="24" y="690" width="520" height="160" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"/><text x="36" y="712" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Хто працює у своїх системах</text><text x="36" y="731" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Медик вносить еПМК у МІС ЗСУ, як і зараз: нової форми немає.</text><text x="36" y="747" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">ВЛК оглядає й оформлює постанову у своїй МІС.</text><text x="36" y="763" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Начальник медслужби й командир оформлюють довідку в СЕДО.</text><text x="36" y="779" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Фінслужба й орган ОГД ухвалюють рішення у своєму контурі.</text><text x="36" y="795" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Сервіс отримує від них події й показує стан у кейсі.</text><rect x="560" y="690" width="550" height="160" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"/><text x="572" y="712" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Безпека й дані</text><text x="572" y="731" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Мінімум даних: лише те, що потрібно для кроку маршруту.</text><text x="572" y="747" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Доступ за роллю й частиною, перевірка на кожен запит.</text><text x="572" y="763" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Захист за ст. 8 Закону №80/94-ВР, погодження власника,</text><text x="572" y="779" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">категоризація інформації; без цього реальних даних немає.</text><text x="572" y="795" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Командир бачить службовий мінімум, не медичні записи.</text><rect x="1126" y="690" width="490" height="160" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"/><text x="1138" y="712" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Як читати</text><text x="1138" y="731" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Суцільна стрілка: користувач працює з каналом / сервісом.</text><text x="1138" y="747" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Пунктир: цільова інтеграція з наявною системою. Її треба</text><text x="1138" y="763" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">погодити з власником; у прототипі — симулятор подій.</text><text x="1138" y="779" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">Синій: модулі нового сервісу. Сірий: наявні системи,</text><text x="1138" y="795" font-size="11.5" font-weight="normal" fill="#5a6370" text-anchor="start">які ми не змінюємо.</text></svg>
